name: Sync Bunker Subscriptions (Mos Hub & Karing)

on:
  schedule:
    - cron: '*/30 * * * *' # Every 30 minutes
  workflow_dispatch:       # Manual trigger from GitHub UI
  repository_dispatch:     # Webhook trigger from GitLab / external events
    types: [mos_hub_update, sub_update]
  push:
    paths:
      - 'scripts/sync_mos_bunker.py'
      - 'scripts/sync_karing_subscription.py'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Sync Mos Hub subscriptions (BLWL_MIX & WHITE_LIST to Clash Meta)
        run: python3 scripts/sync_mos_bunker.py

      - name: Sync Karing subscription (alexander-official.ru)
        run: python3 scripts/sync_karing_subscription.py

      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add subscriptions/
          if git diff --staged --quiet; then
            echo "No subscription updates found. Everything is up to date."
          else
            git commit -m "Auto-sync Bunker subscriptions from Mos Hub & web [Clash YAML]"
            git push origin main
          fi
