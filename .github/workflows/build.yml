name: Build Bunker VPN APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: 'v1.3.6'
        type: string
  push:
    branches:
      - master
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: '0'

    - name: Setup Java 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '14742923'
        packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          --channel=0 \
          --install "ndk;30.0.16248370"
        echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> $GITHUB_ENV
        sed -i '10i\
        \
            ndkVersion = "30.0.16248370"' ${{ github.workspace }}/V2rayNG/app/build.gradle.kts

    - name: Setup hev-socks5-tunnel with submodules
      run: |
        rm -rf hev-socks5-tunnel
        git clone --depth 1 --recurse-submodules https://github.com/heiher/hev-socks5-tunnel.git hev-socks5-tunnel

    - name: Build native libhevtun
      run: |
        chmod +x compile-hevtun.sh
        bash compile-hevtun.sh
        mkdir -p V2rayNG/app/libs
        cp -r libs/* V2rayNG/app/libs/ 2>/dev/null || true

    - name: Download Xray Core (libv2ray.aar)
      run: |
        mkdir -p V2rayNG/app/libs
        if [ ! -f "V2rayNG/app/libs/libv2ray.aar" ]; then
          curl -L -o V2rayNG/app/libs/libv2ray.aar https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.11.9/libv2ray.aar
        fi

    - name: Prepare Signing Keystore
      run: |
        if [ ! -f "${{ github.workspace }}/keystore/bunker.jks" ]; then
          mkdir -p ${{ github.workspace }}/keystore
          keytool -genkeypair -v -keystore ${{ github.workspace }}/keystore/bunker.jks \
            -alias bunker -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass bunker123 -keypass bunker123 \
            -dname "CN=BunkerVPN, OU=Bunker, O=BunkerKota, L=Bunker, ST=Bunker, C=RU"
        fi

    - name: Build APK with Gradle
      run: |
        cd V2rayNG
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod 755 gradlew
        ./gradlew assemblePlaystoreRelease \
          -Pandroid.injected.signing.store.file=${{ github.workspace }}/keystore/bunker.jks \
          -Pandroid.injected.signing.store.password=bunker123 \
          -Pandroid.injected.signing.key.alias=bunker \
          -Pandroid.injected.signing.key.password=bunker123

    - name: Prepare Dist
      run: |
        mkdir -p dist
        find V2rayNG/app/build/outputs/apk -type f -name "*arm64-v8a*.apk" -exec cp {} dist/BunkerVPN-arm64-v8a.apk \;
        find V2rayNG/app/build/outputs/apk -type f -name "*universal*.apk" -exec cp {} dist/BunkerVPN-universal.apk \;
        ls -la dist/

    - name: Upload arm64 APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BunkerVPN-arm64-v8a
        path: dist/BunkerVPN-arm64-v8a.apk

    - name: Upload Universal APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BunkerVPN-universal
        path: dist/BunkerVPN-universal.apk

    - name: Create or Update GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ inputs.release_tag || 'v1.3.9' }}
        name: "Бункер VPN v1.3.9 — Режим Stealth (Минимализм) & Fail-Safe WARP+"
        draft: false
        prerelease: false
        make_latest: true
        body: |
          🖤 **Бункер VPN v1.3.9 — Редизайн без AI-слопа & Безотказный WARP+**

          ### 🎨 1. Редизайн по стандарту Unslop-UI:
          - **Режим «Stealth» (Минимализм) по умолчанию:**
            - Глубокий OLED-черный интерфейс (`#000000`) без фоновых обоев и неонового свечения.
            - Нативная компактная шапка высотой **48dp** вместо громоздкой карточки на пол-экрана.
            - Строгие векторные иконки (щит/замок) вместо светящихся аватарок.
          - **Очистка от эмодзи-шума:**
            - Кнопки управления очищены от лишних значков: `Авто`, `Пинг`, `Фильтры`, `Тест`.
            - Убран заголовок `BUNKER CYBER SHIELD` и дублирующие подсказки состояния.
          - **Чистые названия подписок:**
            - Автоматическая миграция названий вкладок без повторов `Бункер | ` и эмодзи:
              - `Микс` (вместо `Бункер | Микс 🌍`)
              - `Белый список` (вместо `Бункер | Белый список (БС) 🛡`)
              - `Завод 443/53` (вместо `Бункер | Завод 443 & 53 🏭`)
              - `Турбо` (вместо `Бункер | Турбо ⚡`)
              - `Telegram SOS` (вместо `Бункер | Telegram SOS 💬`)

          ### ⚡ 2. 100% Гарантия создания WARP+ (Fail-Safe):
          - **Устранена ошибка «Не удалось зарегистрировать WARP (проверьте интернет)»:**
            - При выключенном VPN прямое подключение к Cloudflare API блокируется ТСПУ.
            - Добавлена 3-уровневая система получения конфигов: Cloudflare API ➔ Зеркала пула (`ghfast.top`, `gitmirror.com`, `fastly.jsdelivr.net`) ➔ Вшитый офлайн-пул проверенных WireGuard-ключей.
            - Создание WARP+ срабатывает мгновенно даже без подключения к сети.
            - Все профили используют порт **880** с handshake client ID для обхода блокировок WireGuard в РФ.

          ### 🌐 3. Скоростные зеркала обновлений (ghfast.top):
          - Встроенные автообновления и скачивание APK теперь работают напрямую через скоростные зеркала без необходимости включать сторонний VPN.

          ---
          💬 Чат сообщества: https://t.me/BUNKER_K0TA
          📢 Канал Бункера: https://t.me/BUNKER_KOTA
          🤖 Telegram Бот: @BunkerCatOSBot
          👑 Создатель: @k0tlux
        files: |
          dist/BunkerVPN-arm64-v8a.apk
          dist/BunkerVPN-universal.apk
