name: Build Bunker VPN APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'
        type: string
  push:
    branches:
      - master
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: '0'

    - name: Setup Java 21
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '14742923'
        packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          --channel=0 \
          --install "ndk;30.0.16248370"
        echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> $GITHUB_ENV
        sed -i '10i\
        \
            ndkVersion = "30.0.16248370"' ${{ github.workspace }}/V2rayNG/app/build.gradle.kts

    - name: Setup hev-socks5-tunnel with submodules
      run: |
        rm -rf hev-socks5-tunnel
        git clone --depth 1 --recurse-submodules https://github.com/heiher/hev-socks5-tunnel.git hev-socks5-tunnel

    - name: Build native libhevtun
      run: |
        chmod +x compile-hevtun.sh
        bash compile-hevtun.sh
        mkdir -p V2rayNG/app/libs
        cp -r libs/* V2rayNG/app/libs/ 2>/dev/null || true

    - name: Download Xray Core (libv2ray.aar)
      run: |
        mkdir -p V2rayNG/app/libs
        if [ ! -f "V2rayNG/app/libs/libv2ray.aar" ]; then
          curl -L -o V2rayNG/app/libs/libv2ray.aar https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.11.9/libv2ray.aar
        fi

    - name: Prepare Signing Keystore
      run: |
        if [ ! -f "${{ github.workspace }}/keystore/bunker.jks" ]; then
          mkdir -p ${{ github.workspace }}/keystore
          keytool -genkeypair -v -keystore ${{ github.workspace }}/keystore/bunker.jks \
            -alias bunker -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass bunker123 -keypass bunker123 \
            -dname "CN=BunkerVPN, OU=Bunker, O=BunkerKota, L=Bunker, ST=Bunker, C=RU"
        fi

    - name: Build APK with Gradle
      run: |
        cd V2rayNG
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod 755 gradlew
        ./gradlew assemblePlaystoreRelease \
          -Pandroid.injected.signing.store.file=${{ github.workspace }}/keystore/bunker.jks \
          -Pandroid.injected.signing.store.password=bunker123 \
          -Pandroid.injected.signing.key.alias=bunker \
          -Pandroid.injected.signing.key.password=bunker123

    - name: Prepare Dist
      run: |
        mkdir -p dist
        find V2rayNG/app/build/outputs/apk -type f -name "*arm64-v8a*.apk" -exec cp {} dist/BunkerVPN-arm64-v8a.apk \;
        find V2rayNG/app/build/outputs/apk -type f -name "*universal*.apk" -exec cp {} dist/BunkerVPN-universal.apk \;
        ls -la dist/

    - name: Upload arm64 APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BunkerVPN-arm64-v8a
        path: dist/BunkerVPN-arm64-v8a.apk

    - name: Upload Universal APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BunkerVPN-universal
        path: dist/BunkerVPN-universal.apk

    - name: Create or Update GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ inputs.release_tag || 'v1.2.9' }}
        name: "Бункер VPN v1.2.9 — Чистый интерфейс, Панель фильтров и Teyes CC3 2K"
        draft: false
        prerelease: false
        make_latest: true
        body: |
          🐈‍⬛ **ОБНОВЛЕНИЕ: Бункер VPN v1.2.9 для Android!** ⚡️

          🪐 **Что нового и улучшено в версии 1.2.9:**
          - 🎛️ **Разгружен главный экран — Новая Cyber-панель «Фильтры и Управление»:**
            - Главный экран стал чистым, легким и воздушным: высота шапки уменьшена в 2 раза, список серверов теперь занимает до 90% экрана!
            - Все второстепенные опции (Анти-РКН, YouTube, Telegram, AI, темы, очистка) аккуратно спрятаны в стильную панель управления по кнопке «🎛️ Фильтры».
          - ⚡ **Мгновенный фильтр «Только онлайн» & Скрытие таймаутов (по запросу комьюнити):**
            - В горизонтальной строке фильтров над серверами появился мгновенный чип «⚡ Онлайн (X)» — скрывает все недоступные сервера в один тап!
            - В панели фильтров доступен переключатель «Скрыть недоступные узлы», который скрывает таймауты навсегда.
          - 📶 **Авто-сортировка доступных серверов по пингу:**
            - Сразу после замера пинга (кнопка «Пинг») Бункер автоматически ранжирует узлы от минимального пинга к максимальному — самые быстрые сервера сразу вверху!
          - 🚗 **Полная поддержка авто-планшетов Teyes CC3 2K и горизонтальных экранов:**
            - Увеличен нижний скролл-отступ (`bottom padding`), благодаря чему последний сервер в списке теперь всегда легко доступен и никогда не перекрывается нижней полосой подключения.
            - Компактный режим шапки позволяет комфортно листать серверы даже на экранах с низким вертикальным разрешением (горизонтальные 2K, 16:9, 16:10).
          - 📱 **Исправлен баг верстки на Samsung A-11 в свернутом режиме:**
            - Устранено вертикальное побуквенное разбиение скорости трафика («↓ 1 5 . 0 K B / s») при сворачивании панели. Теперь текст скорости и статуса надежно зафиксирован в одну строку.
          - ⚡ **Встроенный In-App установщик обновлений:**
            - Обновление прямо внутри приложения без перехода в браузер или на сторонние сайты.

          💬 Чат сообщества: https://t.me/BUNKER_K0TA
          📢 Канал Бункера: https://t.me/BUNKER_KOTA
          💡 Создатель: @k0tlux
        files: |
          dist/BunkerVPN-arm64-v8a.apk
          dist/BunkerVPN-universal.apk
