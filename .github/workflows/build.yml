name: Build Bunker VPN APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'
        type: string
  push:
    branches:
      - master
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: '0'

    - name: Setup Java 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '14742923'
        packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          --channel=0 \
          --install "ndk;30.0.16248370"
        echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> $GITHUB_ENV
        sed -i '10i\
        \
            ndkVersion = "30.0.16248370"' ${{ github.workspace }}/V2rayNG/app/build.gradle.kts

    - name: Setup hev-socks5-tunnel with submodules
      run: |
        rm -rf hev-socks5-tunnel
        git clone --depth 1 --recurse-submodules https://github.com/heiher/hev-socks5-tunnel.git hev-socks5-tunnel

    - name: Build native libhevtun
      run: |
        chmod +x compile-hevtun.sh
        bash compile-hevtun.sh
        mkdir -p V2rayNG/app/libs
        cp -r libs/* V2rayNG/app/libs/ 2>/dev/null || true

    - name: Download Xray Core (libv2ray.aar)
      run: |
        mkdir -p V2rayNG/app/libs
        if [ ! -f "V2rayNG/app/libs/libv2ray.aar" ]; then
          curl -L -o V2rayNG/app/libs/libv2ray.aar https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.11.9/libv2ray.aar
        fi

    - name: Prepare Signing Keystore
      run: |
        if [ ! -f "${{ github.workspace }}/keystore/bunker.jks" ]; then
          mkdir -p ${{ github.workspace }}/keystore
          keytool -genkeypair -v -keystore ${{ github.workspace }}/keystore/bunker.jks \
            -alias bunker -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass bunker123 -keypass bunker123 \
            -dname "CN=BunkerVPN, OU=Bunker, O=BunkerKota, L=Bunker, ST=Bunker, C=RU"
        fi

    - name: Build APK with Gradle
      run: |
        cd V2rayNG
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod 755 gradlew
        ./gradlew assemblePlaystoreRelease \
          -Pandroid.injected.signing.store.file=${{ github.workspace }}/keystore/bunker.jks \
          -Pandroid.injected.signing.store.password=bunker123 \
          -Pandroid.injected.signing.key.alias=bunker \
          -Pandroid.injected.signing.key.password=bunker123

    - name: Prepare Dist
      run: |
        mkdir -p dist
        find V2rayNG/app/build/outputs/apk -type f -name "*arm64-v8a*.apk" -exec cp {} dist/BunkerVPN-arm64-v8a.apk \;
        find V2rayNG/app/build/outputs/apk -type f -name "*universal*.apk" -exec cp {} dist/BunkerVPN-universal.apk \;
        ls -la dist/

    - name: Upload arm64 APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BunkerVPN-arm64-v8a
        path: dist/BunkerVPN-arm64-v8a.apk

    - name: Upload Universal APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BunkerVPN-universal
        path: dist/BunkerVPN-universal.apk

    - name: Create or Update GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: "v1.2.1-cyber"
        name: "Бункер VPN Cyber Edition (v1.2.1)"
        draft: false
        prerelease: false
        make_latest: true
        body: |
          🐈‍⬛ **ОБНОВЛЕНИЕ: Бункер VPN v1.2.1 Cyber Edition для Android!**
          
          🪐 **Что нового в версии 1.2.1:**
          - 🚀 **Починен спидометр скорости и живой пульс трафика:**
            - Интегрирован прямой опрос сетевой статистики Linux/Android ядра (`android.net.TrafficStats`) для UID приложения в связке с межпроцессным MMKV-мостом из фонового демона ядра.
            - Теперь спидометр скорости на главной панели мгновенно и абсолютно точно отображает реальную скорость приема (`↓ MB/s`) и отдачи (`↑ MB/s`), полностью синхронизируясь со системным монитором шторки Android.
          - 🎛️ **Обновленный неоновый кибер-эквалайзер (`CyberTrafficWave`):**
            - 14 неоновых индикаторов с градиентом (кибер-циан `#06B6D4`, неоновый фиолетовый `#A855F7` и изумрудный `#10B981`).
            - Красивое дыхание матрицы при простое сети и мощная амплитудная пульсация при просмотре видео или скачивании.
          - ⚡ **Переключатель «Умный Анти-РКН 🇷🇺» в 1 тап прямо на главном экране:**
            - Быстрое переключение между режимами:
              - `⚡ Анти-РКН 🇷🇺 (Банки и РФ напрямую)`: Сбер, Тинькофф, Госуслуги, Ozon, Кинопоиск, Яндекс и все российские сервисы работают на максимальной скорости вашего провайдера без VPN. YouTube, Instagram, ChatGPT, Discord, X и заблокированные ресурсы автоматически шифруются и идут через тоннель!
              - `🌐 Полный туннель (Весь трафик)`: 100% защита и приватность для любых зарубежных или публичных Wi-Fi сетей.
          - 🚀 **Встроенная автопроверка обновлений (In-App Auto-Update):**
            - Уведомление прямо в шапке с возможностью обновиться в один клик.
          
          💬 Чат сообщества: https://t.me/BUNKER_K0TA
          📢 Канал Бункера: https://t.me/BUNKER_KOTA
          💡 Создатель: @k0tlux
        files: |
          dist/BunkerVPN-arm64-v8a.apk
          dist/BunkerVPN-universal.apk
