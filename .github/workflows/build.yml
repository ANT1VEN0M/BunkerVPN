name: Build Bunker VPN APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: 'v1.3.6'
        type: string
  push:
    branches:
      - master
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: '0'

    - name: Setup Java 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '14742923'
        packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          --channel=0 \
          --install "ndk;30.0.16248370"
        echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> $GITHUB_ENV
        sed -i '10i\
        \
            ndkVersion = "30.0.16248370"' ${{ github.workspace }}/V2rayNG/app/build.gradle.kts

    - name: Setup hev-socks5-tunnel with submodules
      run: |
        rm -rf hev-socks5-tunnel
        git clone --depth 1 --recurse-submodules https://github.com/heiher/hev-socks5-tunnel.git hev-socks5-tunnel

    - name: Build native libhevtun
      run: |
        chmod +x compile-hevtun.sh
        bash compile-hevtun.sh
        mkdir -p V2rayNG/app/libs
        cp -r libs/* V2rayNG/app/libs/ 2>/dev/null || true

    - name: Download Xray Core (libv2ray.aar)
      run: |
        mkdir -p V2rayNG/app/libs
        if [ ! -f "V2rayNG/app/libs/libv2ray.aar" ]; then
          curl -L -o V2rayNG/app/libs/libv2ray.aar https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.11.9/libv2ray.aar
        fi

    - name: Prepare Signing Keystore
      run: |
        if [ ! -f "${{ github.workspace }}/keystore/bunker.jks" ]; then
          mkdir -p ${{ github.workspace }}/keystore
          keytool -genkeypair -v -keystore ${{ github.workspace }}/keystore/bunker.jks \
            -alias bunker -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass bunker123 -keypass bunker123 \
            -dname "CN=BunkerVPN, OU=Bunker, O=BunkerKota, L=Bunker, ST=Bunker, C=RU"
        fi

    - name: Build APK with Gradle
      run: |
        cd V2rayNG
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod 755 gradlew
        ./gradlew assemblePlaystoreRelease \
          -Pandroid.injected.signing.store.file=${{ github.workspace }}/keystore/bunker.jks \
          -Pandroid.injected.signing.store.password=bunker123 \
          -Pandroid.injected.signing.key.alias=bunker \
          -Pandroid.injected.signing.key.password=bunker123

    - name: Prepare Dist
      run: |
        mkdir -p dist
        find V2rayNG/app/build/outputs/apk -type f -name "*arm64-v8a*.apk" -exec cp {} dist/BunkerVPN-arm64-v8a.apk \;
        find V2rayNG/app/build/outputs/apk -type f -name "*universal*.apk" -exec cp {} dist/BunkerVPN-universal.apk \;
        ls -la dist/

    - name: Upload arm64 APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BunkerVPN-arm64-v8a
        path: dist/BunkerVPN-arm64-v8a.apk

    - name: Upload Universal APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BunkerVPN-universal
        path: dist/BunkerVPN-universal.apk

    - name: Create or Update GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ inputs.release_tag || 'v1.4.0' }}
        name: "Бункер VPN v1.4.0 «Ultimate Combine» — Безотказные подписки, Сетка 2-Column & Универсальный импортёр"
        draft: false
        prerelease: false
        make_latest: true
        body: |
          🛡️ **Бункер VPN v1.4.0 «Ultimate Combine» — Ультимативный комбайн обхода блокировок**

          ### 🔄 1. Безотказное обновление ссылок и встроенных подписок:
          - **Каскадный отказоустойчивый движок зеркал (Fail-Safe Mirrors):**
            - Решена проблема с зависанием и недоступностью ссылок при включенном и выключенном VPN на операторах РФ (МТС, МегаФон, Билайн, Tele2, Ростелеком).
            - При обновлении клиент автоматически опрашивает каскад зеркал без цензуры: `ghfast.top` ➔ `fastly.jsdelivr.net@main` ➔ `cdn.jsdelivr.net@main` ➔ `ghproxy.net` ➔ `raw.githubusercontent.com`.
            - Устранён баг jsDelivr `@latest`, кэшировавший устаревшие конфиги на 7 дней.
            - Починена кнопка обновления в интерфейсе управления подписками.
          - **Новая встроенная подписка:**
            - Добавлена выделенная вкладка **«Discord / Игры»** (оптимизированные UDP/Hysteria2 узлы с минимальным пингом).

          ### 📱 2. Адаптивная сетка серверов (2-Column Card Grid) по умолчанию:
          - Включена современная двухколоночная сетка серверов по умолчанию: на экране сразу видно от 8 до 12 узлов с пингами, протоколами и флагами.
          - Возможность в любой момент переключиться на классический одноколоночный список в один клик.

          ### 📂 3. Универсальный модуль импорта (Universal Importer):
          - **Всеядный парсер конфигов и сообщений из Telegram:**
            - Умное извлечение любых прокси-ссылок (`vless://`, `vmess://`, `trojan://`, `ss://`, `hysteria2://`, `wireguard://`, `socks://`) прямо из сырых текстов каналов, постов и чатов.
            - Многоуровневый автоматический разворот Base64 (до 4 слоёв матрёшки).
            - Нативная поддержка конфигураций **sing-box JSON** (автоматический разбор массива `outbounds` в рабочие профили).
            - Поддержка импорта **NapsternetV** (`NPVO1` open format), **V2RayTun** (`v2raytun://import/`), **INCY** (`incy://crypt1/`) и глубоких ссылок **Happ**.
            - Автоматический поиск и добавление ссылок на подписки из любого вставленного текста.

          ### ⚡ 4. Полный стек протоколов защиты Бункера:
          - VLESS Reality (XTLS Vision) для скоростного интернета.
          - Cloudflare WARP+ на порту 880 (неблокируемый WireGuard) с трёхуровневой системой офлайн-регистрации.
          - Hysteria 2 / QUIC для голосовых каналов Discord и онлайн-игр.
          - Защита от утечек DNS и режим белых списков.

          ---
          💬 Чат сообщества: https://t.me/BUNKER_K0TA
          📢 Канал Бункера: https://t.me/BUNKER_KOTA
          🤖 Telegram Бот: @BunkerCatOSBot
          👑 Создатель: @k0tlux
        files: |
          dist/BunkerVPN-arm64-v8a.apk
          dist/BunkerVPN-universal.apk
