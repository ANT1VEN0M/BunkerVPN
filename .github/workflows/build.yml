name: Build Bunker VPN APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: 'v1.4.5'
        type: string
  push:
    branches:
      - master
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: '0'

    - name: Setup Java 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '14742923'
        packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          --channel=0 \
          --install "ndk;30.0.16248370"
        echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> $GITHUB_ENV
        sed -i '10i\
        \
            ndkVersion = "30.0.16248370"' ${{ github.workspace }}/V2rayNG/app/build.gradle.kts

    - name: Setup hev-socks5-tunnel with submodules
      run: |
        rm -rf hev-socks5-tunnel
        git clone --depth 1 --recurse-submodules https://github.com/heiher/hev-socks5-tunnel.git hev-socks5-tunnel

    - name: Build native libhevtun
      run: |
        chmod +x compile-hevtun.sh
        bash compile-hevtun.sh
        mkdir -p V2rayNG/app/libs
        cp -r libs/* V2rayNG/app/libs/ 2>/dev/null || true

    - name: Download Xray Core (libv2ray.aar)
      run: |
        mkdir -p V2rayNG/app/libs
        if [ ! -f "V2rayNG/app/libs/libv2ray.aar" ]; then
          curl -L -o V2rayNG/app/libs/libv2ray.aar https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.11.9/libv2ray.aar
        fi

    - name: Prepare Signing Keystore
      run: |
        if [ ! -f "${{ github.workspace }}/keystore/bunker.jks" ]; then
          mkdir -p ${{ github.workspace }}/keystore
          keytool -genkeypair -v -keystore ${{ github.workspace }}/keystore/bunker.jks \
            -alias bunker -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass bunker123 -keypass bunker123 \
            -dname "CN=BunkerVPN, OU=Bunker, O=BunkerKota, L=Bunker, ST=Bunker, C=RU"
        fi

    - name: Build APK with Gradle
      run: |
        cd V2rayNG
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod 755 gradlew
        ./gradlew assemblePlaystoreRelease \
          -Pandroid.injected.signing.store.file=${{ github.workspace }}/keystore/bunker.jks \
          -Pandroid.injected.signing.store.password=bunker123 \
          -Pandroid.injected.signing.key.alias=bunker \
          -Pandroid.injected.signing.key.password=bunker123

    - name: Prepare Dist
      run: |
        mkdir -p dist
        find V2rayNG/app/build/outputs/apk -type f -name "*arm64-v8a*.apk" -exec cp {} dist/BunkerVPN-arm64-v8a.apk \;
        find V2rayNG/app/build/outputs/apk -type f -name "*universal*.apk" -exec cp {} dist/BunkerVPN-universal.apk \;
        ls -la dist/

    - name: Upload arm64 APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BunkerVPN-arm64-v8a
        path: dist/BunkerVPN-arm64-v8a.apk

    - name: Upload Universal APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BunkerVPN-universal
        path: dist/BunkerVPN-universal.apk

    - name: Create or Update GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ inputs.release_tag || 'v1.4.5' }}
        name: "Бункер VPN v1.4.5 — 100% русификация & YouTube 4K Турбо"
        draft: false
        prerelease: false
        make_latest: true
        body: |
          ⚡ **Бункер VPN v1.4.5 — 100% русификация & YouTube 4K Турбо (Anti-Buffering)**

          ### 🚀 Что нового в v1.4.5:
          - **100% русификация всех экранов (устранены все недопереведённые места):**
            - Корневые ресурсы приложения (`res/values/`) теперь по умолчанию содержат полноценный русский язык.
            - Исправлена проблема на устройствах Xiaomi HyperOS / MIUI, Samsung и смартфонах с системным языком English / CIS (Казахстан, Беларусь, Украина), где интерфейс частично откатывался на английский (`Config`, `Protection off`, `Collapse`, `Testing: 0 / 165`, `Auto`, `Ping`, `Filters`, `Test`, `All`, `Other`).
            - Главный заголовок экрана заменён с «Config / Профиль» на понятное **«Серверы»**.
            - Создана отдельная локализация `values-en/` для пользователей, явно выбравших английский в настройках.
          - **⚡ Режим «YouTube 4K Турбо» (Блокировка QUIC UDP:443):**
            - В меню «Фильтры и управление» добавлен тумблер YouTube 4K Турбо (включён по умолчанию).
            - На уровне ядра Xray Core блокируются исходящие пакеты UDP:443 (QUIC/HTTP3), на которых ТСПУ РКН душит трафик YouTube до 144p или обрывает воспроизведение через минуту.
            - Мобильное приложение YouTube, ReVanced, SmartTube и браузеры мгновенно переключаются на скоростной TCP TLS через VLESS-Reality: мгновенный старт в 1080p60 / 4K без буферизации.
          - **Поддержка импорта WireGuard (.conf и URI):**
            - Бесшовный импорт конфигурационных файлов `.conf` и универсальных ссылок `wireguard://`.

